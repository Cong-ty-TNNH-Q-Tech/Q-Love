name: qlove
description: Q-Love - Super App Hẹn Hò & Mạng Xã Hội Giải Trí
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  in_app_review: ^2.0.9
  go_router: ^14.0.0
  shared_preferences: ^2.2.3
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5
  dio: ^5.4.2
  mapbox_maps_flutter: ^2.0.0
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.2.1
  web_socket_channel: ^3.0.0
  mobile_scanner: ^3.5.6
  qr_flutter: ^4.1.0
  app_links: ^6.1.1
  fl_chart: ^0.66.0
  just_audio: ^0.9.36
  flutter_card_swiper: ^3.0.0
  home_widget: ^0.3.1
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3
  bloc_test: ^9.1.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#0F0F1A"
  image: "assets/icon/app_icon.png"
  android: true
  ios: true
