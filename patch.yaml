
  /admin/v1/violations:
    get:
      summary: L?y danh sch vi ph?m (Admin)
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Thnh cng
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
