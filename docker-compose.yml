version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: qlove_postgres
    environment:
      POSTGRES_USER: qlove
      POSTGRES_PASSWORD: qlovepassword
      POSTGRES_DB: qlove
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: qlove_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
