                  type: string
                  format: date-time
                  description: Giờ hẹn dự kiến
                location_note:
                  type: string
                  example: Café The Coffee House, Q1
      responses:
        '201':
          description: Tạo khế ước thành công, Xu bị đóng băng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatingContract'
        '400':
          description: Không đủ Xu hoặc chưa đủ điều kiện chat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
