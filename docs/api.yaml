  /contracts/{contract_id}/scan:
    post:
      summary: Quét Dynamic QR code để xác nhận gặp mặt
      description: QR Token rotate mỗi 30 giây. Quét thành công → Hoàn trả toàn bộ
        Xu đóng băng cho cả 2.
      tags:
        - Contracts
      parameters:
        - in: path
          name: contract_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - qr_token
              properties:
                qr_token:
                  type: string
      responses:
        '200':
          description: Khớp mã QR — Hoàn tiền cọc cho cả 2 thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: completed
                  message:
                    type: string
