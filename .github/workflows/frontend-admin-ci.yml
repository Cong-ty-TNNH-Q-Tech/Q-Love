name: Frontend Admin CI (React/Vite)

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend/admin/**'
      - '.github/workflows/frontend-admin-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/admin/**'
      - '.github/workflows/frontend-admin-ci.yml'

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
          else
            echo "Skipping, package.json not found"
          fi

      - name: Run Linter
        run: |
          if [ -f "package.json" ]; then
            npm run lint --if-present || exit 0
          fi

      - name: Build App
        run: |
          if [ -f "package.json" ]; then
            npm run build || exit 0
          fi
