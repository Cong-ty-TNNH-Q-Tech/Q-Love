name: Backend CI (Golang Fiber)

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/server/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/server/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Initialize Go Modules (if missing)
        run: |
          if [ ! -f "go.mod" ]; then
            go mod init github.com/Cong-ty-TNNH-Q-Tech/Q-Love/backend/server
            go mod tidy
          fi

      - name: Check code formatting
        run: |
          if [ "$(ls -A .)" ]; then
            go fmt ./...
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: backend/server
          args: --timeout=5m
        continue-on-error: true # Bỏ qua lỗi tạm thời khi code còn trống

      - name: Run Unit Tests and Enforce 90% Coverage
        run: |
          if [ "$(ls -A .)" ] && [ -f "go.mod" ]; then
            go test -v -coverprofile=coverage.out ./... || exit 1
            if [ -f "coverage.out" ]; then
              COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
              echo "Total Test Coverage: $COVERAGE%"
              if (( $(echo "$COVERAGE < 90.0" | bc -l) )); then
                echo "::error::Test coverage ($COVERAGE%) is below the required 90%. Failing the build."
                exit 1
              else
                echo "✅ Coverage requirement met!"
              fi
            fi
          else
            echo "Skipping tests, directory is empty or missing go.mod"
          fi
